[broker]
frontend_address = "tcp://*:9090"
backend_address = "tcp://*:9091"
settings_address = "tcp://*:9092"

[logger]
mongo_uri = "mongodb://localhost:27017"
mongo_db = "torques_analysis"
# sub_topic = ["logger", "metadata", "rfid", "skeleton", "platform", "image", "agent_event", "bridge", "perf_assess"]
# or, subscribe to all topics:
# sub_topic = ["H_initial_walker_aruco", "H_initial_walker_htc", "encoders", "imu"]
sub_topic = ["driver", "FSM/set_point"]
datamax_length = 75
initially_paused = false


#  ____  _             _           
# |  _ \| |_   _  __ _(_)_ __  ___ 
# | |_) | | | | |/ _` | | '_ \/ __|
# |  __/| | |_| | (_| | | | | \__ \
# |_|   |_|\__,_|\__, |_|_| |_|___/
#                |___/             
#

[loadcells]
period = 18
pub_topic = "loadcells"
show_void_phidget = true
[loadcells.serial_number]
mono = 797649
triaxis_l = 582396
triaxis_r = 588795
[loadcells.gains]
back_right = 1.28
front_left = 1.1
back_left = 1.1
front_right = 1.1
fx_r = 1.8
fy_r = 1.8
fx_l = 1.8
fy_l = 1.8

[driver]
sub_topic = "FSM/set_point"
speed_limit = 4
slope = 1000
# It is used only for control in current. Look for GIQ
# acceleration_limit = 1 
# current_limit * sqrt(2) / 10 = max_current (A) 
current_limit = 70
watchdog = 500
torque_current_ratio = 600
wheel_radius = 0.084
port = "/dev/drivers"
dont_block = true
period = 8
queue_size = 1
echo = false

[ego_state]
sub_topic = ["driver", "forces_calibrated", "FSM/odometry", "calibrated_imu", "htc"]
pub_topic = "ego_state"
dead_zone_F = 5
dead_zone_T = 0.3
wheel_radius = 0.084
wheel_base = 0.86
total_ticks_enc = 4096
dist_bar_3LC_x = 0.38
dist_bar_3LC_y = 0.17
dist_bar_side_x = 0.183
dist_bar_side_y = 0.335
angles_load_cells = 0.785375
[ego_state.imu]
sigma_gyro = 0.2
sigma_accel = 0.05
sigma_magnet = 25
dist_y = -0.20
dist_x = 0.7
imu_enable = true

[forces_calibration]
sub_topic = ["loadcells", "GUI", "autocalibration"]
pub_topic = "forces_calibrated"


[FSM]
sub_topic = ["ego_state", "GUI", "driver", "unhookdetector", "overload_detector"]
pub_topic = "FSM/set_point"
time_slipping = 1.2
time_unhook = 2.2
#time_overload = 5
time_overload = 60000
silent = true
[FSM.impedance_control]
wheel_radius = 0.084
wheel_base = 0.86
walker_mass = 59
wheel_mass = 1
I_body = 30.5
[FSM.set_reference]
delta_s = 1.0

[portenta]
sub_topic = ["FSM/portenta"]
port = "/dev/portenta"
silent = false

[hat]
pub_topic = "imu"
period = 20
[hat.enabled_sensors]
gyro = true
humidity = false
pressure = false
compass = true

[GUI_EVENT]
pub_topic = "GUI"
sub_topic = ["FSM/mode", "watchdog"]

[GUI_HF]
pub_topic = "GUI"
sub_topic = ["FSM/path_planning", "driver"]

[GAME_EVENT]
pub_topic = "GAME"
sub_topic = ["watchdog","GUI","FSM/mode"]

[GAME_HF]
pub_topic = "GAME"
sub_topic = ["FSM/path_planning"]

[watchdog]
period = 2000

[imu_calibration]
pub_topic = "calibrated_imu"
sub_topic = ["GUI", "imu"]
num_cycles = 2
n_samples = 300
silent = false

[unhookdetector]
sub_topic = ["forces_calibrated"]
threshold = 0.08 
k = 3            
window_size = 50 
n = 3           
load_cell_names = ["back_left", "back_right", "front_left", "front_right"]

[overload_detector]
sub_topic = ["driver", "ego_state"]
F_th = 5
T_th = 3
current_th = 95
speed_th = 0.5
angular_speed_th = 0.5